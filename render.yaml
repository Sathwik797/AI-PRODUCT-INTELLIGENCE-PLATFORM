# Render Blueprint for AI Product Intelligence Platform
# Deploys both the FastAPI Backend and the React Frontend

services:
  # ---------------------------------------------------------
  # 1. FastAPI Python Backend Web Service
  # ---------------------------------------------------------
  - type: web
    name: ai-product-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/start.py"
    healthCheckPath: /live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: "AI Product Intelligence Platform"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false # Set your remote MySQL URL (e.g. mysql+pymysql://user:pass@host:3306/db)
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API key
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: CORS_ORIGINS
        value: "*" # Or restrict to your frontend Render domain once deployed

  # ---------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ---------------------------------------------------------
  - type: web
    name: ai-product-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-product-backend
          property: host
